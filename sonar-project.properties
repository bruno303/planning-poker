sonar.projectKey=bruno303_planning-poker-backend
sonar.organization=bruno303
sonar.projectName=Planning-poker backend
sonar.projectVersion=1.0

sonar.sources=.
sonar.exclusions=**/vendor/**, **/planning-poker-front/**

sonar.tests=.
sonar.test.inclusions=**/*_test.go, test/integration/**
sonar.test.exclusions=**/vendor/**
sonar.coverage.exclusions=**/vendor/**, **/*_test.go, **/mocks.go, test/integration/**, internal/setup/**, **/planning-poker-front/**, cmd/**, Dockerfile, **/*.md, **/*.mod, **/*.sum

sonar.go.coverage.reportPaths=coverage.out

# False-positive exclusions:
# - Cognitive complexity in test files (inherent to table-driven/assertion-heavy tests).
# - Nested anonymous structs in config are the idiomatic env/yaml binding pattern.
# - Interface naming (single-method interfaces) is a soft convention; existing names
#   (UseCase/UseCaseR/UseCaseO, RedisClient, AdminHub) are intentional and clearer.
sonar.issue.ignore.multicriteria=e1,e2,e3
sonar.issue.ignore.multicriteria.e1.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*_test.go
sonar.issue.ignore.multicriteria.e2.ruleKey=godre:S8205
sonar.issue.ignore.multicriteria.e2.resourceKey=internal/config/config.go
sonar.issue.ignore.multicriteria.e3.ruleKey=godre:S8196
sonar.issue.ignore.multicriteria.e3.resourceKey=internal/application/planningpoker/usecase/usecase.go,internal/infra/boundaries/http/healthcheckers.go,internal/domain/hub.go
