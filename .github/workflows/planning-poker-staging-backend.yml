name: Planning Poker Staging Backend Deployment

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit to build and deploy
        required: true
        default: main
        type: string

concurrency:
  group: planning-poker-staging-backend
  cancel-in-progress: false

env:
  DOCKER_REPO: bruno303/planning-poker-backend
  DEPLOYMENT_REPOSITORY: bruno303/study-topics
  DEPLOYMENT_BRANCH: main
  DEPLOYMENT_MANIFEST: self_hosted/k8s/planning-poker/staging/backend/deployment.yaml

jobs:
  build-and-deploy:
    name: Build and deploy backend to staging
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source ref
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1

      - name: Resolve source commit
        id: source
        run: |
          SOURCE_SHA="$(git rev-parse HEAD)"
          echo "sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "Building backend from $SOURCE_SHA"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.DOCKER_REPO }}:${{ steps.source.outputs.sha }}

      - name: Checkout deployment repository
        uses: actions/checkout@v5
        with:
          repository: ${{ env.DEPLOYMENT_REPOSITORY }}
          ref: ${{ env.DEPLOYMENT_BRANCH }}
          token: ${{ secrets.PLANNING_POKER_PAT }}
          path: deployment-config

      - name: Update staging backend image
        working-directory: deployment-config
        env:
          IMAGE: ${{ env.DOCKER_REPO }}:${{ steps.source.outputs.sha }}
        run: |
          test -f "$DEPLOYMENT_MANIFEST"
          yq eval '.spec.template.spec.containers[0].image = strenv(IMAGE)' -i "$DEPLOYMENT_MANIFEST"

      - name: Detect deployment change
        id: change
        working-directory: deployment-config
        run: |
          if git diff --quiet -- "$DEPLOYMENT_MANIFEST"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Staging backend already references the requested image."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create deployment pull request
        id: pull-request
        if: steps.change.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.PLANNING_POKER_PAT }}
          path: deployment-config
          branch: bump/staging/backend-${{ steps.source.outputs.short_sha }}-${{ github.run_id }}
          base: ${{ env.DEPLOYMENT_BRANCH }}
          title: "[staging] Backend ${{ steps.source.outputs.short_sha }}"
          body: |
            Update the staging backend image.

            - Source repository: `${{ github.repository }}`
            - Source ref: `${{ inputs.source_ref }}`
            - Source commit: `${{ steps.source.outputs.sha }}`
            - Image: `${{ env.DOCKER_REPO }}:${{ steps.source.outputs.sha }}`
            - Environment: `staging`
          commit-message: "chore(staging/backend): deploy ${{ steps.source.outputs.short_sha }}"
          delete-branch: true

      - name: Merge deployment pull request
        id: merge
        if: steps.change.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.PLANNING_POKER_PAT }}
        run: |
          test -n "${{ steps.pull-request.outputs.pull-request-url }}"

          set +e
          AUTO_MERGE_OUTPUT="$(gh pr merge "${{ steps.pull-request.outputs.pull-request-url }}" \
            --repo "$DEPLOYMENT_REPOSITORY" \
            --auto \
            --squash \
            --delete-branch 2>&1)"
          AUTO_MERGE_STATUS=$?
          set -e
          echo "$AUTO_MERGE_OUTPUT"

          if [ "$AUTO_MERGE_STATUS" -eq 0 ]; then
            echo "mode=native-auto-merge" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! grep -Fq "Protected branch rules not configured for this branch" <<< "$AUTO_MERGE_OUTPUT"; then
            echo "Native auto-merge failed for an unexpected reason." >&2
            exit "$AUTO_MERGE_STATUS"
          fi

          echo "Native auto-merge is unavailable because the deployment branch has no protection rules."
          set +e
          CHECK_OUTPUT="$(gh pr checks "${{ steps.pull-request.outputs.pull-request-url }}" \
            --repo "$DEPLOYMENT_REPOSITORY" \
            --json bucket,name 2>&1)"
          set -e

          if grep -Fq "no checks reported" <<< "$CHECK_OUTPUT"; then
            echo "No deployment checks are configured; continuing with the explicit merge."
          else
            echo "$CHECK_OUTPUT"
            timeout 15m gh pr checks "${{ steps.pull-request.outputs.pull-request-url }}" \
              --repo "$DEPLOYMENT_REPOSITORY" \
              --watch \
              --fail-fast \
              --interval 10
          fi

          gh pr merge "${{ steps.pull-request.outputs.pull-request-url }}" \
            --repo "$DEPLOYMENT_REPOSITORY" \
            --squash \
            --delete-branch
          echo "mode=explicit-squash-merge" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Staging backend deployment"
            echo
            echo "- Source ref: `${{ inputs.source_ref }}`"
            echo "- Source commit: `${{ steps.source.outputs.sha }}`"
            echo "- Image: `${{ env.DOCKER_REPO }}:${{ steps.source.outputs.sha }}`"
            if [ "${{ steps.change.outputs.changed }}" = "true" ]; then
              echo "- Deployment PR: ${{ steps.pull-request.outputs.pull-request-url }}"
              echo "- Merge: ${{ steps.merge.outputs.mode }}"
            else
              echo "- Deployment PR: not needed; image already deployed"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
