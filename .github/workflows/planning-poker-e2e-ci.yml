name: Planning Poker E2E CI

on:
  push:
    branches:
      - main
    paths:
      - '**'
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - '**'

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      # compose builds pull Docker Hub images (redis and the Dockerfile base
      # images). Anonymous pulls hit the shared-runner rate limit, so
      # authenticate when the secrets are available and fall back to anonymous
      # pulls otherwise (for example on fork pull requests).
      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run E2E Tests
        env:
          E2E_READY_MAX_RETRIES: 120
        run: make e2e-ci

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: planning-poker-playwright-report
          path: frontend/planning-poker-front/playwright-report
          if-no-files-found: ignore

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: planning-poker-test-results
          path: frontend/planning-poker-front/test-results
          if-no-files-found: ignore
